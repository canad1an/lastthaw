<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Last Thaw: a world half taken by ice, the living land holding on below. -->
  <defs>
    <clipPath id="globe"><circle cx="32" cy="32" r="26"/></clipPath>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#bfe3f7"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cb342"/>
      <stop offset="1" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b1a2b"/>
  <g clip-path="url(#globe)">
    <!-- sea -->
    <rect width="64" height="64" fill="#1b4b73"/>
    <!-- land mass -->
    <path d="M6 38 C14 30 22 34 30 30 C38 26 46 32 58 28 L58 64 L6 64 Z" fill="url(#land)"/>
    <!-- ice cap creeping down -->
    <path d="M4 4 H60 V22 C54 27 48 20 42 25 C36 30 30 22 24 27 C18 32 12 24 4 28 Z" fill="url(#ice)"/>
    <!-- frost line -->
    <path d="M4 28 C12 24 18 32 24 27 C30 22 36 30 42 25 C48 20 54 27 60 22" fill="none" stroke="#e0f2fe" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
  <!-- the last warm sun -->
  <circle cx="46" cy="46" r="5" fill="#f59e0b" stroke="#0b1a2b" stroke-width="1.5"/>
</svg>
