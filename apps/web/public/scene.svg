<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <!-- Last Thaw backdrop: a glacier wall grinding south over the peaks while the last warm camps hold the valley below. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.45" stop-color="#07111f"/>
      <stop offset="0.8" stop-color="#0b1a2b"/>
      <stop offset="1" stop-color="#0a1522"/>
    </linearGradient>
    <linearGradient id="glacier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb3d3"/>
      <stop offset="0.55" stop-color="#4a88b0"/>
      <stop offset="1" stop-color="#255a80"/>
    </linearGradient>
    <linearGradient id="glacierFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7ea6"/>
      <stop offset="1" stop-color="#113148"/>
    </linearGradient>
    <linearGradient id="peakFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a4a66"/>
      <stop offset="1" stop-color="#132a40"/>
    </linearGradient>
    <linearGradient id="peakNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3448"/>
      <stop offset="1" stop-color="#0c1a28"/>
    </linearGradient>
    <linearGradient id="snowcap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f9fd"/>
      <stop offset="1" stop-color="#b7dcef" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#05090f"/>
    </linearGradient>
    <radialGradient id="fire" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fdfdfd"/>
      <stop offset="0.6" stop-color="#e2f0fa"/>
      <stop offset="1" stop-color="#bfe0f3"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bfe0f3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#bfe0f3" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#e2f0fa">
    <circle cx="120" cy="80" r="1.2" opacity=".8"/><circle cx="310" cy="140" r="0.9" opacity=".6"/><circle cx="455" cy="60" r="1.4" opacity=".9"/>
    <circle cx="620" cy="190" r="0.8" opacity=".5"/><circle cx="780" cy="90" r="1.1" opacity=".7"/><circle cx="905" cy="230" r="0.9" opacity=".5"/>
    <circle cx="1040" cy="70" r="1.3" opacity=".8"/><circle cx="1210" cy="160" r="0.8" opacity=".6"/><circle cx="1330" cy="40" r="1.1" opacity=".7"/>
    <circle cx="1480" cy="210" r="0.9" opacity=".5"/><circle cx="1600" cy="110" r="1.4" opacity=".9"/><circle cx="1760" cy="60" r="1" opacity=".6"/>
    <circle cx="1850" cy="180" r="0.8" opacity=".5"/><circle cx="220" cy="260" r="0.7" opacity=".4"/><circle cx="1130" cy="290" r="0.7" opacity=".4"/>
    <circle cx="690" cy="300" r="0.8" opacity=".45"/><circle cx="1690" cy="280" r="0.9" opacity=".5"/><circle cx="60" cy="330" r="0.7" opacity=".4"/>
  </g>

  <!-- moon -->
  <circle cx="1500" cy="190" r="160" fill="url(#moonGlow)"/>
  <circle cx="1500" cy="190" r="46" fill="url(#moon)"/>

  <!-- far peaks -->
  <path d="M0 520 L140 420 L260 470 L380 360 L470 430 L600 330 L720 440 L840 370 L960 450 L1080 340 L1200 430 L1320 380 L1440 460 L1560 350 L1680 440 L1800 390 L1920 470 L1920 720 L0 720 Z" fill="url(#peakFar)"/>
  <path d="M380 360 L420 395 L350 405 Z M600 330 L650 370 L560 375 Z M1080 340 L1125 380 L1035 380 Z M1560 350 L1605 390 L1515 390 Z" fill="url(#snowcap)" opacity=".8"/>

  <!-- glacier wall: the ice itself, grinding down over the far range -->
  <path d="M0 0 H1920 V300 C1840 330 1780 290 1700 320 C1620 350 1560 300 1480 330 C1400 360 1330 310 1250 345 C1170 380 1100 320 1020 350 C940 380 880 330 800 360 C720 390 660 335 580 365 C500 395 440 340 360 370 C280 400 200 350 120 380 C80 395 40 385 0 400 Z" fill="url(#glacier)"/>
  <path d="M0 400 C40 385 80 395 120 380 C200 350 280 400 360 370 C440 340 500 395 580 365 C660 335 720 390 800 360 C880 330 940 380 1020 350 C1100 320 1170 380 1250 345 C1330 310 1400 360 1480 330 C1560 300 1620 350 1700 320 C1780 290 1840 330 1920 300 V380 C1840 410 1780 370 1700 400 C1620 430 1560 380 1480 410 C1400 440 1330 390 1250 425 C1170 460 1100 400 1020 430 C940 460 880 410 800 440 C720 470 660 415 580 445 C500 475 440 420 360 450 C280 480 200 430 120 460 C80 475 40 465 0 480 Z" fill="url(#glacierFace)" opacity=".9"/>
  <!-- crevasses -->
  <g stroke="#1b4d70" stroke-width="2" fill="none" opacity=".6">
    <path d="M240 120 L265 230 L250 310"/><path d="M700 60 L690 180 L720 300"/><path d="M1180 90 L1210 200 L1190 330"/><path d="M1620 40 L1600 150 L1630 290"/>
  </g>
  <g stroke="#f3f9fd" stroke-width="1.2" fill="none" opacity=".5">
    <path d="M244 120 L269 230 L254 310"/><path d="M704 60 L694 180 L724 300"/><path d="M1184 90 L1214 200 L1194 330"/><path d="M1624 40 L1604 150 L1634 290"/>
  </g>
  <!-- frost haze under the wall -->
  <path d="M0 470 H1920 V560 H0 Z" fill="#9fd0ea" opacity=".1" filter="url(#blur8)"/>

  <!-- near peaks -->
  <path d="M0 700 L120 600 L260 660 L400 560 L520 640 L660 540 L800 650 L920 590 L1060 670 L1200 570 L1340 660 L1480 600 L1620 680 L1760 580 L1920 660 L1920 900 L0 900 Z" fill="url(#peakNear)"/>
  <path d="M400 560 L445 600 L360 600 Z M660 540 L705 580 L620 580 Z M1200 570 L1245 610 L1160 610 Z M1760 580 L1805 620 L1720 620 Z" fill="url(#snowcap)" opacity=".55"/>

  <!-- valley floor -->
  <path d="M0 860 C300 830 600 870 960 850 C1300 830 1600 870 1920 840 V1080 H0 Z" fill="url(#ground)"/>

  <!-- fires and their glow -->
  <g>
    <ellipse cx="420" cy="905" rx="170" ry="80" fill="url(#fire)"/>
    <ellipse cx="1180" cy="915" rx="200" ry="90" fill="url(#fire)"/>
    <ellipse cx="1660" cy="890" rx="140" ry="70" fill="url(#fire)"/>
    <path d="M414 905 C408 893 412 884 420 876 C421 888 427 890 428 897 C432 892 433 889 434 884 C440 892 442 900 436 908 Z" fill="#fbbf24"/>
    <path d="M1172 915 C1166 903 1170 894 1178 886 C1179 898 1185 900 1186 907 C1190 902 1191 899 1192 894 C1198 902 1200 910 1194 918 Z" fill="#fbbf24"/>
    <path d="M1654 890 C1648 878 1652 869 1660 861 C1661 873 1667 875 1668 882 C1672 877 1673 874 1674 869 C1680 877 1682 885 1676 893 Z" fill="#fbbf24"/>
  </g>

  <!-- watchtower and palisade -->
  <g fill="#05090f">
    <path d="M1080 905 L1084 800 L1116 800 L1120 905 Z"/>
    <path d="M1074 804 H1126 L1120 786 H1080 Z"/>
    <path d="M1070 790 L1130 790 L1100 744 Z"/>
    <path d="M1130 905 L1130 850 L1140 840 L1150 850 L1150 905 L1160 905 L1160 852 L1170 842 L1180 852 L1180 905 L1190 905 L1190 854 L1200 844 L1210 854 L1210 905 Z"/>
    <path d="M1000 905 L1000 852 L1010 842 L1020 852 L1020 905 L1030 905 L1030 854 L1040 844 L1050 854 L1050 905 L1060 905 L1060 856 L1070 846 L1080 856 L1080 905 Z"/>
    <path d="M1100 744 L1100 700 L1128 712 L1100 724 Z"/>
  </g>
  <path d="M1100 700 L1128 712 L1100 724 Z" fill="#b45309"/>

  <!-- spearmen silhouettes, left camp -->
  <g fill="#05090f">
    <g transform="translate(300 850)"><circle cx="0" cy="-54" r="8"/><path d="M-9 -44 H9 L12 0 H-12 Z"/><path d="M12 -30 L30 2 L24 2 L8 -24 Z"/><path d="M22 -80 L25 -78 L18 12 L14 12 Z"/><path d="M19 -84 L28 -70 L20 -72 Z"/></g>
    <g transform="translate(345 858) scale(0.92)"><circle cx="0" cy="-54" r="8"/><path d="M-9 -44 H9 L12 0 H-12 Z"/><path d="M-10 -36 L-26 -4 L-20 -4 L-6 -26 Z"/><path d="M-20 -92 L-17 -90 L-6 10 L-10 10 Z"/><path d="M-22 -96 L-10 -84 L-19 -82 Z"/></g>
    <g transform="translate(520 862) scale(0.85)"><circle cx="0" cy="-54" r="8"/><path d="M-9 -44 H9 L12 0 H-12 Z"/><path d="M10 -40 L34 -56 L36 -50 L12 -32 Z"/><rect x="-24" y="-46" width="20" height="34" rx="3"/></g>
    <g transform="translate(560 870) scale(0.8)"><circle cx="0" cy="-54" r="8"/><path d="M-9 -44 H9 L12 0 H-12 Z"/><path d="M8 -90 L11 -88 L8 10 L4 10 Z"/><path d="M6 -94 L16 -80 L8 -82 Z"/></g>
  </g>
  <!-- right camp, marching -->
  <g fill="#05090f">
    <g transform="translate(1560 858) scale(0.9)"><circle cx="0" cy="-54" r="8"/><path d="M-9 -44 H9 L12 0 H-12 Z"/><path d="M-6 -92 L-3 -90 L2 10 L-2 10 Z"/><path d="M-8 -96 L2 -82 L-6 -84 Z"/></g>
    <g transform="translate(1600 866) scale(0.85)"><circle cx="0" cy="-54" r="8"/><path d="M-9 -44 H9 L12 0 H-12 Z"/><path d="M8 -90 L11 -88 L8 10 L4 10 Z"/><path d="M6 -94 L16 -80 L8 -82 Z"/><rect x="-26" y="-44" width="18" height="32" rx="3"/></g>
    <g transform="translate(1740 870) scale(0.78)"><circle cx="0" cy="-54" r="8"/><path d="M-9 -44 H9 L12 0 H-12 Z"/><path d="M-4 -92 L-1 -90 L4 10 L0 10 Z"/><path d="M-6 -96 L4 -82 L-4 -84 Z"/></g>
    <g transform="translate(1800 875) scale(0.75)"><circle cx="0" cy="-54" r="8"/><path d="M-9 -44 H9 L12 0 H-12 Z"/><path d="M10 -36 L30 -12 L24 -8 L8 -28 Z"/></g>
  </g>

  <!-- ground mist -->
  <path d="M0 900 H1920 V1000 H0 Z" fill="#9fd0ea" opacity=".06" filter="url(#blur8)"/>
  <!-- bottom vignette so content reads over it -->
  <rect y="880" width="1920" height="200" fill="#05090f" opacity=".55"/>
</svg>
