# Production overrides for the dedicated Last Thaw Lightsail instance.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d
services:
  postgres:
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  mailpit:
    profiles: ["never"]

  # Connection pooler: apps use transaction pooling on :6432; migrations go direct to postgres.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: lastthaw
      DB_PASSWORD: lastthaw
      DB_NAME: lastthaw
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      LISTEN_PORT: "6432"
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "40"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U lastthaw || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]

  api:
    restart: unless-stopped
    ports: !reset []
    deploy:
      replicas: 2
    environment:
      NODE_ENV: production
      DEV_TOOLS: "false"
      SMTP_HOST: ${SMTP_HOST}
      PUBLIC_URL: https://lastthaw.com
      DATABASE_URL: postgres://lastthaw:lastthaw@pgbouncer:6432/lastthaw
      DATABASE_URL_DIRECT: postgres://lastthaw:lastthaw@postgres:5432/lastthaw
      DB_POOL_MAX: "20"
    depends_on:
      pgbouncer:
        condition: service_started

  worker:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEV_TOOLS: "false"
      SMTP_HOST: ${SMTP_HOST}
      DATABASE_URL: postgres://lastthaw:lastthaw@pgbouncer:6432/lastthaw
      DB_POOL_MAX: "20"
    depends_on:
      pgbouncer:
        condition: service_started

  ai:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEV_TOOLS: "false"
      SMTP_HOST: ${SMTP_HOST}
      DATABASE_URL: postgres://lastthaw:lastthaw@pgbouncer:6432/lastthaw
      DB_POOL_MAX: "10"
    depends_on:
      pgbouncer:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    volumes:
      - webdist:/srv/web
    profiles: ["app"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - webdist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    profiles: ["app"]

volumes:
  webdist:
  caddy_data:
  caddy_config:
