services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lastthaw
      POSTGRES_PASSWORD: lastthaw
      POSTGRES_DB: lastthaw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastthaw"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["node", "dist/api/index.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://lastthaw:lastthaw@postgres:5432/lastthaw
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    profiles: ["app"]

  ai:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["node", "dist/worker/ai.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://lastthaw:lastthaw@postgres:5432/lastthaw
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["app"]

  worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["node", "dist/worker/index.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://lastthaw:lastthaw@postgres:5432/lastthaw
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["app"]

volumes:
  pgdata:
