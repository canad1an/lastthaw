name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lastthaw
          POSTGRES_PASSWORD: lastthaw
          POSTGRES_DB: lastthaw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lastthaw"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://lastthaw:lastthaw@localhost:5432/lastthaw
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-secret-not-for-production-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - run: npm run test:game -w apps/server
      - run: npm run build
